spring.application.name=websentry-backend
server.port=${BACKEND_PORT:8080}

# --- WebSentry settings -------------------------------------------------------
# Every value comes from an environment variable. See .env.example in the
# project root. A blank key switches that feature off instead of breaking a scan.

websentry.scorer=${WEBSENTRY_SCORER:ml}
websentry.cache-ttl-seconds=${WEBSENTRY_CACHE_TTL_SECONDS:300}

websentry.ml.url=${ML_SERVICE_URL:http://127.0.0.1:8000}
websentry.ml.timeout-ms=${ML_SERVICE_TIMEOUT_MS:1500}

websentry.anthropic.api-key=${ANTHROPIC_API_KEY:}
websentry.anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
websentry.anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:200}

websentry.safe-browsing.api-key=${SAFE_BROWSING_API_KEY:}

websentry.mongodb.uri=${MONGODB_URI:}

websentry.admin.username=${ADMIN_USERNAME:admin}
websentry.admin.password=${ADMIN_PASSWORD:change-me-before-demo}

# --- MongoDB ------------------------------------------------------------------
# Spring needs an address even when MongoDB is switched off, so a local default
# is used. StorageConfig decides which store is actually used.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/websentry}
spring.data.mongodb.database=${MONGODB_DATABASE:websentry}

# --- Logging ------------------------------------------------------------------
# Every external call logs how long it took. These numbers feed the performance
# section of the evaluation chapter.
logging.level.com.websentry=INFO
